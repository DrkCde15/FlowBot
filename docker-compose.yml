version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - DATABASE_URL=file:/data/flowbot.db
      - PYTHON_BACKEND_URL=http://localhost:8000
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      - INTEGRATIONS_SECRET=${INTEGRATIONS_SECRET:-change-me-integrations-hmac}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - db-data:/data
    restart: unless-stopped

volumes:
  db-data:
